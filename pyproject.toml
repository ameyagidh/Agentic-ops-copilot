[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ops-copilot"
version = "1.0.0"
description = "Agentic AI Operations Copilot — triages incidents, gathers evidence, and drafts grounded root-cause hypotheses."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CommerceIQ" }]
keywords = ["agentic-ai", "sre", "incident-response", "langgraph", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langgraph>=0.2.0,<0.3.0",
    "langgraph-checkpoint-sqlite>=1.0.0,<2.0.0",
    "langchain-core>=0.3.0,<0.4.0",
    "langchain>=0.3.0,<0.4.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "httpx>=0.27,<1.0",
    "structlog>=24.1,<25.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
    "prometheus-client>=0.20,<1.0",
    "sse-starlette>=2.1,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2.0,<0.3.0"]
bedrock = ["langchain-aws>=0.2.0,<0.3.0"]
retrieval = ["langchain-chroma>=0.1.4,<0.2.0", "chromadb>=0.5.0,<0.6.0"]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "httpx>=0.27,<1.0",
    "asgi-lifespan>=2.1,<3.0",
]

[project.scripts]
ops-copilot = "ops_copilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_copilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
